name: CI

on:
  push:
      branches: [ main ]
  pull_request:
      branches : [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup Docker image
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        run: |
          docker build -t event-api:latest .

      - name: Run Container
        run: |
          docker run -d -p 5000:5000 --name event-api-container event-api:latest
            for i in {1..20}; do
              if curl -fsS http://localhost:5000/api/health; then
                echo "Health check OK"
                exit 0
              fi
              echo "Waiting for API... ($i)"
              sleep 1
            done
            echo "Health check failed"
            docker logs event-api-container || true
            exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements-test.txt

      - name: start tests against container
        run: |
          pytest -v

      - name: Clean up Container
        if: always()
        run: |
          docker stop event-api-container || true
          docker rm event-api-container || true
          
      - name: Login to docker
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Tag Docker image
        run: |
          docker tag event-api:latest ${{secrets.DOCKERHUB_USERNAME}}/event:latest

      - name: Push to docker hub
        run: |
          docker push ${{secrets.DOCKERHUB_USERNAME}}/event:latest

      - name: Trigger Render redeploy
        run: |
          curl -X POST ${{secrets.RENDER_DEPLOY_HOOK}}

